<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Estrous Cycle Scoring Widget</title>
  <!-- include CSS used by the original widget -->
  <link crossorigin="anonymous" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet" />
  <style type="text/css">
    @media (max-width: 576px) {
        .xsTableDiv { width: 300px !important; overflow-x: scroll; }
    }
    table { border: 2px solid black; }
    th { padding: 5px; border: 2px solid black; }
    td { padding: 5px; border: 1px solid black; }
    .fullWidth { width: 100% }
    button.card-header{ border: none; }
  </style>
</head>
<body>
  <!-- original HTML body content (trimmed) -->
  <div class="container" id = "addMouseDiv">
    <div class="row mt-2 align-items-center">
        <h3 class="myLeftCol">Mouse Info:</h3>
        <div class="col hideView">
            <input type="button" value="Add new mouse" id="addMouse" name="addmouse" class="fullWidth"/>
        </div>
    </div>
    <div class="row mouseInfo">&nbsp;</div>
  </div>
  <div class="container mt-2">
    <div class="row">
      <div class="col-12 col-md font-weight-bold">Sort:</div>
      <div class="col-12 col-md">
        <input type="button" value="By Date" id="sortByDate" name="sortbydate" class="sortButton fullWidth" data-sort="date" />
      </div>
      <div class="col-12 col-md">
        <input type="button" value="By Mouse" id="sortByMouse" name="sortbymouse" class="sortButton fullWidth" data-sort="mouse" />
      </div>
      <div class="col-12 col-md">
        <input type="button" value="By Day" id="sortByDay" name="sortbyday" class="sortButton fullWidth" data-sort="day" />
      </div>
    </div>
    <div class="row mt-2">
      <div class="col"><input type="button" value="Show only scoring" id="scoringButton" name="scoringbutton" class="toggleSpec fullWidth"/></div>
    </div>
  </div>
  <div class="container mt-4 cardContainer"><div class="madeCards">&nbsp;</div></div>
  <div class="container mt-2" id="copyDiv"> <!-- copy controls omitted for brevity --> </div>
  <div class="container mt-2 tableOuterDiv">
    <div class="table-responsive xsTableDiv">
      <table class="table" id="mouseTable"><thead><tr><th class="mouse">mouseID</th><th class="cycleNum">cycleID</th><th class="startDate">cycleStartDate</th></tr></thead><tbody></tbody></table>
      <p>&nbsp;</p>
    </div>
  </div>

  <div class="container"><div class="row"><div class="col"><input type="button" value="Update Charts" id="makeCharts" name="makecharts"></div></div></div>
  <div class="container" id="chartDiv">&nbsp;</div>

  <!-- Add a small debug/send-control for the Shiny integration -->
  <div style="position:fixed; right:8px; bottom:8px; background: rgba(255,255,255,0.95); border:1px solid #ccc; padding:8px; z-index:9999">
    <div><button id="estrous_send_state" class="btn btn-sm btn-primary">Send state to parent</button></div>
    <div style="margin-top:8px"><button id="estrous_request_init" class="btn btn-sm btn-secondary">Request init test data</button></div>
  </div>

  <!-- include jQuery early so the widget script can use $ immediately -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>

  <!-- include the widget script (copied into www/) -->
  <script src="scriptEditor_estrous.js"></script>

  <script>
    // Provide a minimal parent_class stub expected by the widget (prevents errors in standalone mode)
    if (!window.parent_class) {
      window.parent_class = {
        init: function(mode, json_fn){
          // no-op stub; widget will call parent_class.init
          console.log('[parent_class stub] init called', mode);
        },
        to_json: function(){ return JSON.stringify({}); },
        from_json: function(s){ /* no-op */ },
        test_data: function(){ return JSON.stringify({widgetData:{}}); },
        resize_container: function(){ /* no-op */ }
      };
    }

    // Poll for my_widget_script to be ready and then initialize it with test data (use fallback if test_data fails)
    (function waitForWidget(){
      if(window.my_widget_script && typeof my_widget_script.init === 'function'){
        console.log('[estrous wrapper] initializing widget');
        try{
          // Ensure the widget has a parent_class reference to the stub we provided
          try{
            my_widget_script.parent_class = window.parent_class;
            console.log('[estrous wrapper] assigned parent_class to my_widget_script');
          } catch(e){ console.warn('[estrous wrapper] could not assign parent_class', e); }

          var initArg;
          try {
            initArg = my_widget_script.test_data();
          } catch(e){
            console.warn('[estrous wrapper] test_data failed, using fallback init JSON', e);
            initArg = JSON.stringify({widgetData: {}, mouseNums: [], mice: {}});
          }
          my_widget_script.init('edit', initArg);
        }catch(e){console.warn('[estrous wrapper] init error', e)}
      } else {
        setTimeout(waitForWidget, 200);
      }
    })();

    // When the widget script is ready, allow sending state to parent
    document.getElementById('estrous_send_state').addEventListener('click', function(){
      try{
        if (window.my_widget_script && typeof my_widget_script.to_json === 'function'){
          var jsonStr = my_widget_script.to_json();
          var parsed = JSON.parse(jsonStr);
          console.log('[estrous widget] posting state to parent', parsed);
          window.parent.postMessage({type: 'widgetState', json: parsed}, '*');
        } else {
          console.warn('my_widget_script.to_json not ready');
        }
      }catch(e){ console.warn(e) }
    });

    // Allow parent to send a JSON state to this widget
    window.addEventListener('message', function(ev){
      try{
        var d = ev.data;
        if (d && d.type === 'loadWidgetState' && d.json){
          // my_widget_script.from_json expects a string
          if (window.my_widget_script && typeof my_widget_script.from_json === 'function'){
            my_widget_script.from_json(JSON.stringify(d.json));
            console.log('[estrous widget] applied loaded state');
          }
        }
      }catch(e){ console.warn(e) }
    }, false);

    // Request test data from the widget (calls its test_data function and initializes)
    document.getElementById('estrous_request_init').addEventListener('click', function(){
      try{
        if (window.my_widget_script && typeof my_widget_script.test_data === 'function'){
          var test = my_widget_script.test_data();
          console.log('[estrous widget] test data ->', test);
        } else {
          console.warn('my_widget_script.test_data not available');
        }
      }catch(e){console.warn(e)}
    });
  </script>
</body>
</html>
